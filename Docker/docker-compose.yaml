
services:
  apache_php_mysql_mongodb:
    image: ebota/daw:apache_php_mysql_mongodb
    ports:
      - "8080:80"
    volumes:
      - ../php:/var/www/html
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://a25jawmohbou_db_user:Jawad123@projectegip3.qszzchv.mongodb.net/?appName=PROJECTEGIP3}
      - MONGODB_DB=${MONGODB_DB:-projecte_gip3}
    command: /bin/bash -c "composer install --no-interaction --no-plugins --no-scripts && echo WEBSERVER_________UP_________AND_______RUNNIIIIIIING && apache2-foreground"
    depends_on:
       - db

  db:
    # Tota la informació d'aquesta imatge està https://dockerhub.com/_/mysql
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: usuari
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8

    volumes:
      - ./db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d


  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  # BBDD no sql,
  mongo:
    image: mongo:latest
    volumes:  
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    ports:
      - "8082:8081"
    environment:
      #Per entrar a la web de mongo-express, les credencials són
      #admin
      #pass
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
    depends_on:
      - mongo


volumes:
  mongodb_data: